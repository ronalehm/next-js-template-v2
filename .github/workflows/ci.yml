name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: npm audit (prod, high/critical blocks)
        run: |
          set -o pipefail
          status=0
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log || status=$?
          { echo '### npm audit --omit=dev --audit-level=high'; echo '```'; cat audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
